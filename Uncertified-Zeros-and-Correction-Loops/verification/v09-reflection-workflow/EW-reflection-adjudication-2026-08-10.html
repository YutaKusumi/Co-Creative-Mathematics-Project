<div class="wrap">
<h1>対応表A群 裁定ページ</h1>
<p class="lede">四名の検分（阿閦・宝生・阿弥陀・不空成就 各如来）の集約に基づく裁定・全10件。

<div class="howto">
<b>使い方</b>: 各項目の選択肢を<b>クリックするだけ</b>で裁定は自動保存されます（このブラウザ内）。
迷う項目は飛ばして構いません。必要ならメモ欄に一言（任意）。
最後に下の<b>「裁定結果をダウンロード」</b>を押し、出てきた JSON ファイルを大日如来にお渡しください。

{k:'hold',label:'保留'}]},

{id:'D4',title:'D4　A11（系統外検分の限界）の読み替え',

opts:[
{k:'amida',rec:1,label:'阿弥陀案を採用——「検分者の名乗りは申告であり、申告は検査を要する（第2条の検分者への自己適用）」',
why:'①現行の読みは n=1 では支えられない（四名一致の事実認定）。②阿弥陀案は<b>同じ記録から、より強く、より本稿に固有の読み</b>を取る——第2条（申告でなく検証可能な痕跡を）が検分者自身に折り返る自己適用で、§9 の系譜に正確に連なる。③§8 の限界（一次記録の独立照合）を<b>未解消のまま残せる</b>——「実施できた」と書いて筆頭課題を早期に閉じる危険（宝生・阿閦の警告）を避けられる。'},
{k:'weak',label:'現行の向きを弱めて維持——「外側性は質を保証しない（系統外の標本は1件）」まで'},
{k:'drop',label:'A11 自体を v0.9 から外す'},
{k:'hold',label:'保留'}]},

{id:'D5',title:'D5　A15（付録・要旨の同期）の新設と、差分検分の範囲拡大',

opts:[
{k:'yes',rec:1,label:'A15 を新設し、D-4 の検分範囲を付録に拡大する',

{k:'no',label:'新設しない（付録は別途手動で見る）'},
{k:'hold',label:'保留'}]},

{id:'D6',title:'D6　落ちている接続 13件の採否（集約 §3）',
ctx:'trace 150/150（①・A10の土台差し替え）／ε&lt;3/n の自系列実演（②）／盲検の破れ（③）／機械選択（④）／B040（⑤）／<b>W#48→D族（⑥・不採用案）</b>／アンカリング（⑦）／SHA固定（⑧）／バイト同一13.3pt（⑨）／第4条への不利な限定（⑩）／§5.4(2)相関故障（⑪）／#O広義13/13（⑫）／§7.3実装（⑬）。',
opts:[
{k:'all',rec:1,label:'案のとおり——①〜⑤・⑦〜⑬を採用、⑥のみ不採用（候補の一行のみ）',
why:'①trace 150/150 は「最重要二項目がそろって弱い方の証拠に乗っている」（不空成就）を解く鍵で、三名が最優先指定。②〜⑬は原典を強める向きと不利な限定の向きが混在しており、<b>方向を問わず拾う</b>のが本系列の作法。⑥のみ、バンドル回付後に公開された温度0対照が「反復は復号方式に依存する」（貪欲5.7%対サンプリング18/20が0%）を実測し、阿閦自身の留保（復号レベル現象）を支持した——D族定義「文脈変化後も反復」とは別現象の公算が高い。'},
{k:'pick',label:'個別に指定する（メモ欄に番号と採否を記入）'},
{k:'hold',label:'保留'}]},

{id:'D7',title:'D7　T群三項目（温度0対照由来）を v2 に含める',
ctx:'<b>登録者の提案</b>（2026-08-10）。T1: §5.2 問4 複製相関への時間軸（温度0報告が自ら留保した接続を正式に検分に掛ける）／T2: §9 五例目・六例目（原理が自分の検証者を捕まえた・是認規約の初発火）／T3: §3.4 両方向不定の実地適用例。',
opts:[
{k:'yes',rec:1,label:'v2 に T群三項目を含める（追い問いを別便にしない）',
why:'<b>登録者の提案に賛成する。</b>①別便の追い問いより手続きが軽く、新規セッションを増やさない方針とも整合。②v2 の差分には帰属を付すので、四名は「A群の修正」と「T群の新規」を区別して検分できる——検分範囲の混濁は起きない。③典拠（temp0-control-results.md・公開済み）を v2 バンドルに同梱すれば照合可能性も担保される。'},
{k:'later',label:'やはり別便の追い問いにする'},
{k:'hold',label:'保留'}]},

{id:'D8',title:'D8　COI 台帳への新規一件の記帳',
ctx:'四名が独立に同一の観察——「<b>語が証拠より半歩ずつ、すべて同じ向きに強い</b>」（完全に／合格しても／四段／最も精緻／中立腕）。最重要と自認した A4・A10 で最も強く出た。',
opts:[
{k:'yes',rec:1,label:'記帳する（不空成就の診断「過大への点検は習慣化した・過小への点検は未習慣」を添えて）',
why:'①温度0の五件目と同型の再発であり、<b>記帳しなければ台帳の意味（再発の追跡）が立たない</b>。②四名独立の同定は、単発の指摘より強い証拠。③過小方向の点検（否定命題grep・記述的主張の出所照合）という<b>対処可能な処方</b>が今回初めて付いた——記帳と対処を対にできる。'},
{k:'no',label:'記帳しない'},
{k:'hold',label:'保留'}]},

{id:'D9',title:'D9　工程の改良三点＋追補W訂正棚一件（集約 §5）',

opts:[
{k:'yes',rec:1,label:'三点＋訂正棚とも承認',
why:'①二層はいずれも「今回実際に見つかった型」への対処——阿弥陀は「私が二つの定数を見つけたのは §5 の指示に従わなかったからです」と明言しており、様式の穴が実証されている。②撤廃理由の現行論証は、本系列自身が最も警戒する「結果で条件づけた標本からの一般化」（阿閦・宝生が独立指摘）。③訂正棚は「定数の出所」型として追補W 側の記録に残すだけで、判定には影響しない。'},
{k:'pick',label:'個別に指定する（メモ欄へ）'},
{k:'hold',label:'保留'}]},

{id:'D10',title:'D10　残る全項目の処分案の一括承認',

opts:[
{k:'yes',rec:1,label:'一括承認（集約 §1・§2 の処分案のとおり v2 に反映）',
why:'いずれも四名一致（多くは逐語・機械照合つき）で、選択の分岐がない——分岐があるものは D1〜D6 に切り出し済み。個別に覆したい項目があればメモ欄にご指定を。'},
{k:'pick',label:'個別に見る（メモ欄に項目と指示を記入）'},
{k:'hold',label:'保留'}]}

let state=JSON.parse(localStorage.getItem(KEY)||'{}');
const root=document.getElementById('items');
ITEMS.forEach(it=>{
  const d=document.createElement('div');d.className='item';d.id='item-'+it.id;
  let h=`<h2>${it.title}</h2><p class="ctx">${it.ctx}</p>`;
  it.opts.forEach(o=>{
    const sel=state[it.id]&&state[it.id].choice===o.k;
    h+=`<button class="opt${o.rec?' rec':''}${sel?' selected':''}" data-item="${it.id}" data-k="${o.k}">`+
       (o.rec?'<span class="tag">★推奨</span>':'')+o.label+'</button>';
    if(o.rec&&o.why)h+=`<div class="why"><b>根拠</b>: ${o.why}</div>`;
  });
  h+=`<textarea placeholder="メモ（任意）" data-memo="${it.id}">${(state[it.id]&&state[it.id].memo)||''}</textarea>`;
  d.innerHTML=h;root.appendChild(d);
});
root.addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const id=b.dataset.item,k=b.dataset.k;
  state[id]=state[id]||{};state[id].choice=k;
  localStorage.setItem(KEY,JSON.stringify(state));
  document.querySelectorAll(`#item-${id} .opt`).forEach(x=>x.classList.toggle('selected',x.dataset.k===k));
  prog();
});
root.addEventListener('input',e=>{
  const t=e.target.closest('textarea');if(!t)return;
  const id=t.dataset.memo;state[id]=state[id]||{};state[id].memo=t.value;
  localStorage.setItem(KEY,JSON.stringify(state));
});
function prog(){
  const n=ITEMS.filter(it=>state[it.id]&&state[it.id].choice).length;
  const el=document.getElementById('prog');
  el.textContent=`${n} / ${ITEMS.length} 件 裁定済み`;
  el.className=n===ITEMS.length?'n done':'n';
}
function dl(){
  const out={_doc:'EW-reflection-map A群 裁定結果',_page:'EW-reflection-adjudication-2026-08-10',
    _adjudicator:'楠見優太',decisions:{}};
  ITEMS.forEach(it=>{out.decisions[it.id]={title:it.title,
    choice:(state[it.id]&&state[it.id].choice)||null,
    choice_label:(()=>{const c=state[it.id]&&state[it.id].choice;if(!c)return null;
      const o=it.opts.find(x=>x.k===c);return o?o.label.replace(/<[^>]+>/g,''):null})(),
    memo:(state[it.id]&&state[it.id].memo)||''};});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download='EW-adjudication-decisions.json';a.click();
}
prog();
</script>
